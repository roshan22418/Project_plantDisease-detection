name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests

  recommendation-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r PlantDiseaseDetectionAndTheirRecomandation/requirements.txt transformers pytest
      - run: pytest PlantDiseaseDetectionAndTheirRecomandation/tests

  keras-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r PlantDiseaseDetection2024/requirements.txt pytest
      - run: pytest PlantDiseaseDetection2024/tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
